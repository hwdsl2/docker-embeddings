name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/shellcheck.yml'
      - '.github/workflows/embed_test.yml'
      - '.github/workflows/arm64_test.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/shellcheck.yml

  embed_test:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/embed_test.yml

  arm64_test:
    if: github.repository_owner == 'hwdsl2'
    uses: ./.github/workflows/arm64_test.yml
