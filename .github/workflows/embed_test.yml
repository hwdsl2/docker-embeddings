name: embed_test

on: workflow_call

jobs:
  embed_test:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'hwdsl2'
    strategy:
      matrix:
        test_id: [no-env, with-env, with-key, with-rerank]
      fail-fast: false
    env:
      TEST_ID: ${{ matrix.test_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test
        run: |
          [ ! -x /usr/bin/docker ] && exit 1

          cd "$GITHUB_WORKSPACE"
          pwd
          ls -ld embed.env.example

          set -x

          docker build -t embed-test .

          if [ "$TEST_ID" = "with-env" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -v embed-test-data:/var/lib/embeddings \
              -v ./embed.env.example:/embed.env:ro \
              -e EMBED_MODEL=BAAI/bge-small-en-v1.5 \
              -p 8000:8000/tcp \
              -d embed-test
          elif [ "$TEST_ID" = "no-env" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -v embed-test-data:/var/lib/embeddings \
              -e EMBED_MODEL=BAAI/bge-small-en-v1.5 \
              -p 8000:8000/tcp \
              -d embed-test
          elif [ "$TEST_ID" = "with-key" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -v embed-test-data:/var/lib/embeddings \
              -e EMBED_MODEL=BAAI/bge-small-en-v1.5 \
              -e EMBED_API_KEY=test-embed-key \
              -p 8000:8000/tcp \
              -d embed-test
          elif [ "$TEST_ID" = "with-rerank" ]; then
            docker run \
              --name "$TEST_ID" \
              --restart=always \
              -v embed-test-data:/var/lib/embeddings \
              -e EMBED_MODEL=BAAI/bge-small-en-v1.5 \
              -e RERANK_ENABLED=true \
              -e RERANK_MODEL=cross-encoder/ms-marco-MiniLM-L6-v2 \
              -p 8000:8000/tcp \
              -p 8001:8001/tcp \
              -d embed-test
          fi

          # Wait for server to be ready (up to 300 seconds for model download)
          i=0
          while [ "$i" -lt 300 ]; do
            if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              # If rerank is enabled, also wait for the reranker
              if [ "$TEST_ID" = "with-rerank" ]; then
                if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1; then
                  break
                fi
              else
                break
              fi
            fi
            sleep 1
            i=$((i + 1))
          done

          docker ps | grep "$TEST_ID"
          docker logs "$TEST_ID"

          # Verify health endpoint
          docker exec "$TEST_ID" curl -sf http://127.0.0.1:8000/health

          # Build optional auth header args for endpoints that require auth when key is set
          embed_curl_args=()
          [ "$TEST_ID" = "with-key" ] && embed_curl_args=(-H "Authorization: Bearer test-embed-key")

          # Test auth enforcement when EMBED_API_KEY is set
          if [ "$TEST_ID" = "with-key" ]; then
            # Request without key should return 401
            http_code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8000/v1/embeddings \
              -H "Content-Type: application/json" \
              -d '{"input": "hello", "model": "text-embedding-ada-002"}' 2>/dev/null || true)
            [ "$http_code" = "401" ] || { echo "Expected 401 without key, got $http_code"; exit 1; }
          fi

          # Verify info endpoint
          curl -sf http://127.0.0.1:8000/info \
            "${embed_curl_args[@]}" \
            | grep -q '"model_id"'

          # Test embed_manage commands
          docker exec "$TEST_ID" embed_manage --showinfo
          docker exec "$TEST_ID" embed_manage --listmodels
          docker exec "$TEST_ID" embed_manage --listrerankers

          # Test embed_manage --pullmodel (pull an already-cached model; verifies command works)
          docker exec "$TEST_ID" embed_manage --pullmodel BAAI/bge-small-en-v1.5

          # Test embeddings endpoint (single input)
          curl -sf http://127.0.0.1:8000/v1/embeddings \
            -H "Content-Type: application/json" \
            "${embed_curl_args[@]}" \
            -d '{"input": "The quick brown fox", "model": "text-embedding-ada-002"}' \
            | grep -q '"embedding"'

          # Test embeddings endpoint (batch input)
          curl -sf http://127.0.0.1:8000/v1/embeddings \
            -H "Content-Type: application/json" \
            "${embed_curl_args[@]}" \
            -d '{"input": ["First sentence", "Second sentence"], "model": "text-embedding-ada-002"}' \
            | grep -q '"embedding"'

          # Test reranking endpoint (only for with-rerank test)
          if [ "$TEST_ID" = "with-rerank" ]; then
            # Verify reranker health
            docker exec "$TEST_ID" curl -sf http://127.0.0.1:8001/health

            # Test rerank endpoint
            rerank_response=$(curl -sf http://127.0.0.1:8001/rerank \
              -H "Content-Type: application/json" \
              -d '{"query": "What is AI?", "texts": ["Artificial intelligence is...", "The weather is sunny."], "raw_scores": false}')
            echo "$rerank_response" | grep -q '"score"'

            # Verify reranker info endpoint
            curl -sf http://127.0.0.1:8001/info | grep -q '"model_id"'
          fi

          docker restart "$TEST_ID"

          sleep 15

          # Wait for server to come back (up to 120 seconds)
          i=0
          while [ "$i" -lt 120 ]; do
            if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              if [ "$TEST_ID" = "with-rerank" ]; then
                if docker exec "$TEST_ID" curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1; then
                  break
                fi
              else
                break
              fi
            fi
            sleep 1
            i=$((i + 1))
          done

          docker ps | grep "$TEST_ID"
          docker logs "$TEST_ID"

          # Verify server is healthy after restart
          docker exec "$TEST_ID" curl -sf http://127.0.0.1:8000/health

          exit 0
      - name: Clear
        if: always()
        run: |
          docker rm -f "$TEST_ID" || true
          docker volume rm embed-test-data || true
          docker rmi embed-test || true